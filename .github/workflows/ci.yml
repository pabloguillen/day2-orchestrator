name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bun test
    runs-on: ubuntu-latest
    # Accounts, sign-in and credits tests run against a real Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # bubblewrap/socat: the agent sandbox (agent-sandbox.ts) fails closed
      # without them. git identity: some tests create real commits.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat
      - run: git config --global user.name "CI" && git config --global user.email "ci@example.com"
      - run: bun install --frozen-lockfile
      # sdk/interaction-telemetry.test.ts drives a real Chromium.
      - run: bunx playwright install --with-deps chromium
      - run: bun test
        env:
          # Never let CI make real Claude calls, even if a test forgets to mock.
          ANTHROPIC_API_KEY: ''
          DAY2_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
